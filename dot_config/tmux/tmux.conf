# vim:number
unbind C-b
set-option -g prefix C-space
bind C-space send-prefix

bind -T copy-mode-vi 'v' send -X 'begin-selection'
bind -T copy-mode-vi 'y' send -X 'copy-selection-and-cancel'
bind -T copy-mode-vi C-c send-keys -X cancel
#bind -T search C-c { send-keys C-c; copy-mode -q; }


bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind -n C-h resize-pane -L 2 
bind -n C-j resize-pane -D 2
bind -n C-k resize-pane -U 2
#bind -n C-l resize-pane -R 2

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n M-/ split-window -v
bind -n M-? split-window -h

bind -n M-\[ copy-mode
bind -n M-\] copy-mode \; send-keys ?
bind -n M-\} copy-mode \; send-keys /


bind -n M-\' last-window
bind -n M-t new-window

set-window-option -g mode-keys vi
set -g base-index 1
#set -g pane-base-index 1
set-option -g history-limit 100000000
#set-option -g default-shell /nix/var/nix/profiles/default/bin/fish
set-option -g default-shell /run/current-system/sw/bin/fish
set-option -g renumber-windows on
